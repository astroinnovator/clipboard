<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Admin login — SysBridge</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="/static/css/styles.css" />
        <link rel="icon" href="/static/favicon.ico" />
    </head>
    <body>
        <header>
            <div class="navbar">
                <div class="navbar-brand">
                    <h1>SysBridge</h1>
                </div>
                <nav class="navbar-menu">
                    <a href="/" class="nav-link">Home</a>
                    <a href="/user/login" class="nav-link">User login</a>
                </nav>
            </div>
        </header>

        <main>
            <div class="login-section">
                <h2>Admin console</h2>
                <p class="lede">Restricted access for operators only.</p>
                <form method="POST" action="/admin/login">
                    <label class="field">
                        <span>Username</span>
                        <input
                            type="text"
                            name="username"
                            placeholder="admin"
                            required
                            autocomplete="username"
                        />
                    </label>
                    <label class="field">
                        <span>Password</span>
                        <input
                            type="password"
                            name="password"
                            placeholder="••••••••"
                            minlength="6"
                            required
                            autocomplete="current-password"
                        />
                    </label>
                    <button type="submit">Sign in</button>
                </form>
                {% if error %}
                <p class="error-message">{{ error }}</p>
                {% endif %}
            </div>
        </main>

        <footer>
            <p>&copy; 2026 SysBridge</p>
        </footer>
    </body>
</html>
