<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Dashboard — SysBridge</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="/static/css/styles.css" />
        <link rel="icon" href="/static/favicon.ico" />
    </head>
    <body>
        <header>
            <div class="navbar">
                <div class="navbar-brand">
                    <h1>SysBridge</h1>
                </div>
                <nav class="navbar-menu">
                    <a href="/user/logout" class="nav-link logout-btn"
                        >Logout</a
                    >
                </nav>
            </div>
            <p>Logged in as: {{ username }}</p>
        </header>

        <main class="dash">
            <div class="dash-wrap">
                <div class="dash-tabs">
                    <button id="clipboard-manager-btn" class="footer-btn active">
                        My text
                    </button>
                    <button id="copied-text-btn" class="footer-btn">
                        Copied text
                    </button>
                </div>

                <section id="clipboard-manager-section" class="container">
                    <div class="panel-head">
                        <div>
                            <h2>Clipboard</h2>
                            <p class="lede">
                                Write text, then copy it or save it to history.
                            </p>
                        </div>
                    </div>
                    <div class="form-section">
                        <textarea
                            id="text-input"
                            rows="5"
                            placeholder="Type or paste text…"
                        ></textarea>
                        <div class="compose-row">
                            <select id="action-mode">
                                <option value="copy">Copy to clipboard</option>
                                <option value="history">Add to history</option>
                                <option value="both">Copy and save</option>
                            </select>
                            <button id="submit-btn">Submit</button>
                        </div>
                    </div>
                    <div class="history">
                        <div class="panel-head panel-head-inline">
                            <h3>History</h3>
                            <button id="clear-history" class="clear-btn">
                                Clear
                            </button>
                        </div>
                        <ul id="history-list" class="history-list"></ul>
                    </div>
                </section>

                <section
                    id="copied-text-section"
                    class="container"
                    style="display: none"
                >
                    <div class="panel-head">
                        <div>
                            <h2>Copied text</h2>
                            <p class="lede">
                                Items captured from the desktop app.
                            </p>
                        </div>
                        <button id="clear-copied-text" class="clear-btn">
                            Clear
                        </button>
                    </div>
                    <div class="history">
                        <ul id="copied-text-list" class="history-list"></ul>
                    </div>
                </section>
            </div>
        </main>

        <footer>
            <p>&copy; 2026 SysBridge</p>
        </footer>

        <script src="/static/js/script.js"></script>
    </body>
</html>
